<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow, aplicación web para organizar y administrar tareas.">
    <title>TaskFlow - Gestor de tareas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    
<header class="encabezado">
    <div class="contenedor">
        <div class="marca">
            <img
                src="img/taskflow-logo.svg"
                alt="Logotipo de TaskFlow"
                class="logo"
                width="64"
                height="64"
            >
            <h1>TaskFlow</h1>
        </div>
        <p>Organiza tus tareas de forma sencilla</p>
    </div>
</header>

    <main class="contenedor">
        <section class="panel">
            <h2>Nueva tarea</h2>

            <form id="formulario-tarea">
                <div class="campo">
                    <label for="titulo-tarea">Tarea</label>
                    <input
                        type="text"
                        id="titulo-tarea"
                        placeholder="Escribe una tarea..."
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="prioridad-tarea">Prioridad</label>
                    <select id="prioridad-tarea">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>

                <button type="submit" class="boton boton-principal">
                    Agregar tarea
                </button>
            </form>
        </section>

        <section class="panel">
            <div class="encabezado-tareas">
                <div>
                    <h2>Mis tareas</h2>

                    <div class="resumen-tareas">
             <span>Total: <strong id="total-tareas">0</strong></span>
                <span>Pendientes: <strong id="pendientes-tareas">0</strong></span>
             <span>Completadas: <strong id="completadas-tareas">0</strong></span>
                    </div>
            </div>

                <div class="filtros" aria-label="Filtrar tareas">
                    <button class="filtro activo" data-filtro="todas">
                        Todas
                    </button>

                    <button class="filtro" data-filtro="pendientes">
                        Pendientes
                    </button>

                    <button class="filtro" data-filtro="completadas">
                        Completadas
                    </button>
                </div>
            </div>

            <div id="lista-tareas" class="lista-tareas">
                <div id="mensaje-vacio" class="mensaje-vacio">
                    <p>No tienes tareas todavía.</p>
                    <span>Agrega tu primera tarea para comenzar.</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor">
            <p>TaskFlow &copy; 2026</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
